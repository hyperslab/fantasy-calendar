server_tokens               off;

upstream gunicorn {
  server gunicorn:8000;
}

server {
  listen                    80;
  server_name               _;

  access_log                /var/log/nginx/access.log;
  error_log                 /var/log/nginx/error.log;

  location / {
    proxy_pass              http://gunicorn;
    proxy_set_header        Host $host;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect          off;
  }
  location /static {
    autoindex on;
    alias /app/static/;
  }
}
